<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting Site | WDD130 | Chrissie</title>
    <meta name="description" content="White Water Rafting Site">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Abril+Fatface|Poppins">
    <meta name="author" content="Chrissie">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="White Water Rafting Logo" width="150">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!--Hero Section-->
        <div class="hero-section">
            <img src="images/home-hero.jpg"
              alt="Image of a group of people rafting on a rocky river">
            <h1>White Water Rafting Company</h1>
            <p>Create unforgettable memories on the water with us.</p>
            <button><a href="trips.html">Explore Trips</a></button>
        </div>

        <!--Newsletter Section-->
        <form>
            <h2>Sign up for the newsletter</h2>
            <label for="username">Name</label>
            <input type="text" id="username" name="username">
            <label for="usermail">Email</label>
            <input type="email" id="usermail" name="usermail">
            <button type="submit">Subscribe</button>
        </form>

        <!--Rafting Sites Section-->
        <div class="rafting-sites">
            <div class="rafting-section">
                <img src="images/rafting-home.jpg" alt="Image of a group of people rafting">
                <h2>Rafting Trips</h2>
            </div>
            <div class="camping-section">
                <img src="images/camping-home.jpg" alt="Image of a camping tent and a car">
                <h2>Camping</h2>
            </div>
            <div class="meals-section">
                <img src="images/meals-home.jpg"
                  alt="Image of a meal of egg avocado on toast served by the company">
                <h2>Riverside Meals</h2>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 White Water Rafting, Chrissie</p>
        <nav class="socialmedia">
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Logo">
            </a>
            <a href="https://www.youtube.com">
                <img src="images/youtube.svg" alt="YouTube Logo">
            </a>
            <a href="https://web.facebook.com/">
                <img src="images/facebook.svg" alt="Facebook Logo">
            </a>
        </nav>

    </footer>
</body>

</html>
