<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | Quiz Form Activity</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>Online Quiz</h1>
    </header>

    <form>
        <label for="q1">1. Which CSS property is used to change the color of text?</label>
        <input type="text" id="q1" name="q1">

        <label for="q2">2. Explain the fundamental difference between HTML and CSS in web
            development. What are their
            respective roles when building a webpage?</label>
        <textarea id="q2" name="q2"></textarea>

        <label for="q3">3. Which tag creates a hyperlink?</label>
        <select id="q3" name="q3">
            <option value="1">a</option>
            <option value="2">link</option>
            <option value="3">href</option>
        </select>

        <label for="q4">4. How many heading tags are natively available in HTML?</label>
        <input type="number" id="q4" name="q4">

        <button type="submit">Submit Quiz</button>
    </form>
</body>

</html>
